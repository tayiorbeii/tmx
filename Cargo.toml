[package]
name = "tmx"
version = "0.1.0"
edition = "2021"
description = "Lightweight tmux-native workflow layer: palette, notes, MRU, rename, new-in-cwd"
license = "MIT"
readme = "README.md"

[[bin]]
name = "tmx"
path = "src/main.rs"

[lib]
name = "tmx"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1"
thiserror = "1"
which = "6"
shellexpand = "3"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
