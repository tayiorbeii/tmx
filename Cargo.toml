[package]
name = "tmx"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Tmux-native workflows with fuzzy navigation and a bounded WezTerm/tmux destination switcher"
license = "MIT"
readme = "README.md"

[[bin]]
name = "tmx"
path = "src/main.rs"

[[bin]]
name = "tmx-supervisor"
path = "src/bin/tmx-supervisor.rs"

[lib]
name = "tmx"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1"
thiserror = "1"
which = "6"
shellexpand = "3"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = "0.4"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
proptest = "1"
serial_test = "3"
