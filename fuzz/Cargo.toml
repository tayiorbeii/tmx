[package]
name = "tmx-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tmx = { path = ".." }
serde_json = "1"

[[bin]]
name = "inventory_records"
path = "fuzz_targets/inventory_records.rs"
test = false
doc = false
bench = false

[[bin]]
name = "inventory_json"
path = "fuzz_targets/inventory_json.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
