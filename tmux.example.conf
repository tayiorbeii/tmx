# Conflict-safe example tmux bindings for tmx.
# Copy into ~/.tmux.conf after installing the tmx binary.
#
# A dedicated key table avoids overwriting useful default bindings such as
# C (customize-mode), L (previous client), M (select pane), or an existing
# R binding used by tmux-resurrect.

# Enter the tmx key table with three sequential keys: prefix, uppercase T,
# then one lowercase command key. With a C-a prefix, desktop is:
# Ctrl-a (release), Shift-t (release), p. This does not replace prefix + P.
bind-key T switch-client -T tmx

# prefix, then uppercase T, then lowercase p: desktop palette
bind-key -T tmx p display-popup -w 90% -h 80% \
  -d "#{pane_current_path}" \
  -e TMX_ORIGIN_PANE="#{pane_id}" \
  -e TMX_ORIGIN_CWD="#{pane_current_path}" \
  -E 'tmx palette --desktop'

# prefix, then uppercase T, then lowercase m: mobile-friendly palette for Termius/iPhone
bind-key -T tmx m display-popup -w 100% -h 95% \
  -d "#{pane_current_path}" \
  -e TMX_ORIGIN_PANE="#{pane_id}" \
  -e TMX_ORIGIN_CWD="#{pane_current_path}" \
  -e TMX_UI=mobile \
  -E 'tmx palette --mobile'

# prefix + T, then l: previous exact tmx target
bind-key -T tmx l run-shell 'tmx last'

# prefix + T, then n: quick current-session note prompt
bind-key -T tmx n command-prompt -p 'What were you working on?' \
  'run-shell "tmx note session --set %%"'

# prefix + T, then r: mobile-safe rename menu using native tmux prompts
bind-key -T tmx r display-menu -T 'Rename' \
  'Session' s 'command-prompt -p "session name" "rename-session %%"' \
  'Window'  w 'command-prompt -p "window name"  "rename-window %%"' \
  'Pane'    p 'command-prompt -p "pane title"   "select-pane -T %%"'

# prefix + T, then c: create-or-attach session for current directory
bind-key -T tmx c run-shell \
  'TMX_ORIGIN_PANE="#{pane_id}" TMX_ORIGIN_CWD="#{pane_current_path}" tmx new'
